services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATA_DIR: /app/data
      ADMIN_USERNAME: ducadmin
      ADMIN_EMAIL: admin@nguyenduc.local
      ADMIN_PASSWORD: change-this-admin-password
    volumes:
      - app_data:/app/data
    restart: unless-stopped
volumes:
  app_data:
