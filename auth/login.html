<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng nhập • Nguyễn Đức</title><link rel="stylesheet" href="../css/style.css"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"><link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet"></head><body class="auth-page"><div class="auth-bg"></div><div class="auth-wrapper"><div class="auth-brand"><img src="https://sf-static.upanhlaylink.com/img/image_20260926c9cbd15da7c975fc5c974713e836510c.jpg" id="authLogo" alt="Logo"><span>NGUYỄN ĐỨC</span></div><div class="auth-switch"><button id="loginTab" class="active" type="button" onclick="switchAuth('login')">Đăng nhập</button><button id="registerTab" type="button" onclick="switchAuth('register')">Đăng ký</button></div><div id="alert" class="auth-alert"></div><form id="loginForm" onsubmit="handleLogin(event)"><h1>Chào mừng trở lại</h1><p class="auth-sub">Đăng nhập để sử dụng đầy đủ chức năng.</p><div class="input-box"><input id="loginUsername" required autocomplete="username" placeholder="Username hoặc Email"><i class="bx bxs-user"></i></div><div class="input-box"><input id="loginPassword" type="password" required autocomplete="current-password" placeholder="Password"><i class="bx bxs-lock-alt"></i></div><div class="remember-row"><label><input type="checkbox" id="remember"> Ghi nhớ đăng nhập</label><a href="#" onclick="forgotPassword(event)">Quên mật khẩu?</a></div><button class="auth-btn" type="submit">Đăng nhập</button><p class="auth-foot">Chưa có tài khoản? <a href="#" onclick="switchAuth('register');return false">Đăng ký ngay</a></p></form><form id="registerForm" class="hidden" onsubmit="handleRegister(event)"><h1>Tạo tài khoản</h1><p class="auth-sub">Tham gia cộng đồng Nguyễn Đức.</p><div class="input-box"><input id="regFullname" required placeholder="Họ và tên"><i class="bx bxs-id-card"></i></div><div class="input-box"><input id="regUsername" required minlength="3" placeholder="Username"><i class="bx bxs-user"></i></div><div class="input-box"><input id="regEmail" type="email" required placeholder="Email"><i class="bx bxs-envelope"></i></div><div class="input-box"><input id="regPassword" type="password" minlength="6" required placeholder="Mật khẩu (tối thiểu 6 ký tự)"><i class="bx bxs-lock-alt"></i></div><button class="auth-btn" type="submit">Tạo tài khoản</button><p class="auth-foot">Đã có tài khoản? <a href="#" onclick="switchAuth('login');return false">Đăng nhập</a></p></form><a class="back-home" href="../index.html">← Về trang chính</a></div><script src="../js/app.js"></script><script>
(async()=>{try{await syncState();document.getElementById('authLogo').src=getConfig().logo}catch(e){show('⚠ Máy chủ dữ liệu chưa sẵn sàng: '+e.message)}})();
function switchAuth(t){document.getElementById('loginForm').classList.toggle('hidden',t!=='login');document.getElementById('registerForm').classList.toggle('hidden',t!=='register');document.getElementById('loginTab').classList.toggle('active',t==='login');document.getElementById('registerTab').classList.toggle('active',t==='register');show('')}
function show(m,ok=false){const a=document.getElementById('alert');a.textContent=m;a.className='auth-alert '+(m?(ok?'ok':'bad'):'')}
async function handleLogin(e){e.preventDefault();const r=await login(document.getElementById('loginUsername').value.trim(),document.getElementById('loginPassword').value);if(!r.success){show('✕ '+r.message);return}show('✓ Đăng nhập thành công!',true);setTimeout(()=>location.href=(r.user.role==='admin'||r.user.role==='moderator')?'../admin/dashboard.html':'../index.html',350)}
async function handleRegister(e){e.preventDefault();const r=await register(document.getElementById('regUsername').value.trim(),document.getElementById('regEmail').value.trim(),document.getElementById('regPassword').value,document.getElementById('regFullname').value.trim());if(!r.success){show('✕ '+r.message);return}show('✓ Tạo tài khoản thành công. Hãy đăng nhập.',true);e.target.reset();setTimeout(()=>switchAuth('login'),700)}
async function forgotPassword(e){e.preventDefault();const q=prompt('Nhập username hoặc email để gửi yêu cầu cho Admin:');if(!q)return;try{await api('/password-request',{method:'POST',body:JSON.stringify({query:q})});show('✓ Đã gửi yêu cầu. Admin sẽ kiểm tra và hỗ trợ bạn.',true)}catch(err){show('✕ '+err.message)}}
</script></body></html>
