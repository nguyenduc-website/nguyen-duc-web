<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NgducAntiBot • Nguyễn Đức</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#000;color:#f4f4f4;font-family:Arial,Helvetica,sans-serif}body{min-height:100vh;display:flex;align-items:flex-start;justify-content:flex-start;padding:44px 48px}.wrap{width:min(980px,100%)}h1{font-size:42px;margin:0 0 20px;font-weight:700;letter-spacing:-1px}.sub{font-size:24px;margin-bottom:12px}.desc{font-size:18px;line-height:1.55;color:#bcbcbc;max-width:1000px}.verify{margin-top:48px;width:min(430px,100%);min-height:88px;border:2px solid #666;background:#303030;display:flex;align-items:center;gap:18px;padding:18px 22px;box-shadow:0 0 0 1px #222 inset}.spinner{width:38px;height:38px;border-radius:50%;border:4px dotted #2fbf71;animation:spin 1s linear infinite;flex:none}.status{font-size:20px}.brand{margin-left:auto;text-align:center;font-weight:800;letter-spacing:2px;font-size:13px;color:#fff}.brand small{display:block;font-size:9px;color:#aaa;letter-spacing:1px;margin-top:4px}@keyframes spin{to{transform:rotate(360deg)}}.count{margin-top:18px;color:#8f8f8f;font-size:14px}.error{margin-top:20px;color:#ff7272;font-size:14px;display:none}@media(max-width:600px){body{padding:30px 20px}h1{font-size:30px}.sub{font-size:20px}.desc{font-size:15px}.verify{margin-top:34px}.brand{font-size:10px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>nguyen-duc-web.onrender.com</h1>
  <div class="sub">Thực hiện bảo mật</div>
  <div class="desc">Trang web này sử dụng dịch vụ bảo mật để chống bot độc hại. Trang này hiển thị trong khi trang web xác định bạn không phải là bot.</div>
  <div class="verify"><div class="spinner"></div><div><div class="status" id="status">Đang xác minh...</div><div class="count" id="count">Vui lòng chờ khoảng 10–15 giây.</div></div><div class="brand">NGDUC<small>ANTI BOT</small></div></div>
  <div class="error" id="error">Không thể hoàn tất xác minh. Vui lòng tải lại trang.</div>
</div>
<script>
(async()=>{
 const started=Date.now(), delay=12000;
 const status=document.getElementById('status'), count=document.getElementById('count'), error=document.getElementById('error');
 const timer=setInterval(()=>{const left=Math.max(0,Math.ceil((delay-(Date.now()-started))/1000));count.textContent=left?`Đang kiểm tra trình duyệt • còn khoảng ${left} giây`:'Đang hoàn tất xác minh...';},250);
 try{await new Promise(r=>setTimeout(r,delay));const r=await fetch('/api/antibot/verify',{method:'POST',headers:{'content-type':'application/json'},body:'{}',credentials:'include'});if(!r.ok)throw new Error();status.textContent='✓ Xác minh thành công';count.textContent='Đang chuyển tới website...';setTimeout(()=>location.replace('/'),500)}catch{clearInterval(timer);error.style.display='block';status.textContent='Xác minh không hoàn tất';count.textContent='';}
})();
</script>
</body>
</html>
